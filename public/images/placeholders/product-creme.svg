<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <rect width="800" height="1100" fill="#F8F8F3" />
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#E7DCC6" stroke-width="1.5" />
  
  <!-- Cream jar / bottle outline -->
  <g transform="translate(400, 520)" stroke="#30302B" stroke-width="1.5" fill="none">
    <!-- Cap -->
    <rect x="-105" y="-170" width="210" height="55" rx="3" fill="#B0925C" stroke="#B0925C" />
    
    <!-- Body -->
    <path d="M-115,-110 L115,-110 C130,-110 135,-100 135,-85 L130,95 C130,115 115,125 95,125 L-95,125 C-115,125 -130,115 -130,95 L-135,-85 C-135,-100 -130,-110 -115,-110 Z" fill="#EAD7CE" opacity="0.45" />
    
    <!-- Label -->
    <rect x="-85" y="-60" width="170" height="140" fill="#F8F8F3" stroke="#8C887C" stroke-width="0.8" stroke-dasharray="3 3" />
    <text x="0" y="-15" font-family="serif" font-size="22" fill="#30302B" text-anchor="middle" font-weight="500">Sévane</text>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#B0925C" stroke-width="0.8" />
    <text x="0" y="22" font-family="sans-serif" font-size="7.5" letter-spacing="1.5" fill="#30302B" text-anchor="middle">CRÈME HYDRATANTE</text>
    <text x="0" y="42" font-family="sans-serif" font-size="7.5" letter-spacing="1.2" fill="#8C887C" text-anchor="middle">50 ML / 1.7 FL OZ</text>
  </g>

  <text x="400" y="860" font-family="sans-serif" font-size="11" letter-spacing="3" fill="#8C887C" text-anchor="middle">
    TEMPORARY PRODUCT VISUAL PLACEHOLDER
  </text>
  <text x="400" y="890" font-family="sans-serif" font-size="10" letter-spacing="2" fill="#B0925C" text-anchor="middle">
    SLOT: PRODUCT_CREME_HYDRATANTE (50 ML)
  </text>
</svg>

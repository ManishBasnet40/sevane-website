<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <rect width="800" height="1100" fill="#F8F8F3" />
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="#E7DCC6" stroke-width="1.5" />
  
  <!-- Skincare luxury jar outline -->
  <g transform="translate(400, 520)" stroke="#30302B" stroke-width="1.5" fill="none">
    <!-- Gold jar cap -->
    <rect x="-120" y="-190" width="240" height="65" rx="3" fill="#B0925C" stroke="#B0925C" />
    <line x1="-115" y1="-135" x2="115" y2="-135" stroke="#30302B" stroke-width="0.8" opacity="0.3" />
    
    <!-- Jar glass body -->
    <path d="M-135,-120 L135,-120 C145,-120 150,-110 150,-95 L145,110 C145,130 130,140 105,140 L-105,140 C-130,140 -145,130 -145,110 L-150,-95 C-150,-110 -145,-120 -135,-120 Z" fill="#E7DCC6" opacity="0.5" />
    
    <!-- Label on jar -->
    <rect x="-90" y="-70" width="180" height="150" fill="#F8F8F3" stroke="#8C887C" stroke-width="0.8" stroke-dasharray="3 3" />
    <text x="0" y="-20" font-family="serif" font-size="22" fill="#30302B" text-anchor="middle" font-weight="500">Sévane</text>
    <line x1="-35" y1="-5" x2="35" y2="-5" stroke="#B0925C" stroke-width="0.8" />
    <text x="0" y="18" font-family="sans-serif" font-size="8" letter-spacing="2" fill="#30302B" text-anchor="middle">BAUME DE NUIT</text>
    <text x="0" y="38" font-family="sans-serif" font-size="8" letter-spacing="1.5" fill="#8C887C" text-anchor="middle">50 ML</text>
  </g>

  <text x="400" y="860" font-family="sans-serif" font-size="11" letter-spacing="3" fill="#8C887C" text-anchor="middle">
    TEMPORARY PRODUCT VISUAL PLACEHOLDER
  </text>
  <text x="400" y="890" font-family="sans-serif" font-size="10" letter-spacing="2" fill="#B0925C" text-anchor="middle">
    SLOT: PRODUCT_BAUME_DE_NUIT (50 ML)
  </text>
</svg>
